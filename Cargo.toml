[package]
name = "webbrot"
version = "0.1.0"
edition = "2021"

[dependencies]
fastrand = { version = "2.2.0", features = ["js"], default-features = false }
leptos = { version = "0.7.8", default-features = false, features = ["csr"] }
num = "0.4.3"
tracing = "0.1.41"
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "Document", "HtmlAnchorElement", "HtmlCanvasElement", "Url", "Window", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlTexture", "WebGlUniformLocation", "WebGlVertexArrayObject"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
rpath = false
overflow-checks = false
